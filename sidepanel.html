<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>MakeVideo → Flow</title>
<style>
  body{font:13px/1.45 system-ui,sans-serif;margin:0;padding:12px;background:#111;color:#eee}
  h1{font-size:15px;margin:0 0 10px}
  label{display:block;margin:8px 0 3px;color:#aaa}
  select,input,textarea{width:100%;box-sizing:border-box;background:#1d1d1d;color:#eee;border:1px solid #444;border-radius:6px;padding:6px}
  button{background:#3b6cff;color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;margin:6px 6px 0 0}
  button.sec{background:#333}button.red{background:#c0392b}button:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:6px;align-items:center}
  table{width:100%;border-collapse:collapse;margin-top:8px}
  td,th{padding:4px 5px;border-bottom:1px solid #2a2a2a;text-align:left;vertical-align:top}
  .th{width:96px;height:54px;object-fit:cover;border-radius:4px;display:block;background:#222}
  .th.none{display:flex;align-items:center;justify-content:center;color:#777;font-size:11px;text-align:center}
  .ok{color:#5fd36b}.no{color:#e0a43b}
  #log{background:#000;border:1px solid #333;border-radius:6px;padding:6px;height:200px;overflow:auto;white-space:pre-wrap;font:12px/1.4 Consolas,monospace;margin-top:10px}
  details{margin-top:10px}
  .small{color:#888;font-size:12px}
</style>
</head>
<body>
<h1>🎬 MakeVideo → Google Flow</h1>

<label>Bài hát</label>
<div class="row"><select id="song"></select><button class="sec" id="reload">↻</button></div>

<button class="runBtn" id="run2">▶ Đưa ảnh qua Flow</button>
<div class="row" style="margin-top:8px;justify-content:space-between">
  <label style="margin:0;display:flex;align-items:center;gap:6px;color:#eee"><input type="checkbox" id="onlyNoVideo" checked style="width:auto"> Chỉ hiển thị cảnh chưa có video</label>
  <button class="sec" id="sortBtn" style="margin:0" title="Đổi chiều sắp xếp">Cảnh ↓ giảm dần</button>
</div>
<table id="tbl"></table>
<div class="small" id="info"></div>

<button class="runBtn" id="run">▶ Đưa ảnh + prompt của cảnh đã chọn vào Flow</button>
<button id="stop" class="red" disabled>⛔ Dừng</button>
<button id="diag" class="sec">🔍 Chẩn đoán trang Flow</button>

<div id="log"></div>

<details>
  <summary>Cài đặt</summary>
  <label>Địa chỉ MakeVideo</label>
  <input id="base" placeholder="http://127.0.0.1:5100">
  <label>Thêm vào cuối prompt (tuỳ chọn, vd. “16:9, no text”)</label>
  <input id="suffix">
  <label>Selector tuỳ chỉnh (JSON, chỉ cần khi Flow đổi giao diện)</label>
  <textarea id="sel" rows="4" placeholder='{"prompt":"","file":"","generate":"","video":""}'></textarea>
  <button class="sec" id="save">Lưu cài đặt</button>
</details>

<script src="sidepanel.js"></script>
</body>
</html>
